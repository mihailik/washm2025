[package]
name = "washm"
version = "0.1.0"
edition = "2021"
authors = ["Oleg Mihailik <mihailik@gmail.com>"]
description = "A tiny placeholder washm crate (hello world)."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
# ion-shell removed from default dependencies for wasm builds and PoC; it can be added back as
# path = "ion-fork" for local development. If you need ion, add it as a submodule at the
# root path with `git submodule add`.

[features]
# No default feature is included to keep wasm builds minimal.
default = []
ion = []
