[workspace]
resolver = "2"

members = [
  "washm-engine",
  "washm-engine/testgen-macros",
  "washm-opt",
  "washm-shell",
]

[workspace.package]
version = "0.4.2"
edition = "2021"
authors = ["Oleg Mihailik <mihailik@gmail.com>"]
license = "MIT"
repository = "https://github.com/mavity/washm"
homepage = "https://github.com/mavity/washm"

[profile.release]
opt-level = "z"
codegen-units = 1
panic = "unwind"
debug = false
strip = true

[profile.dev]
panic = "unwind"
debug = false

[profile.dev.package.washm]
debug = 1
