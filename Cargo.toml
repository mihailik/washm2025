[package]
name = "washm"
version = "0.1.0"
edition = "2021"
authors = ["Oleg Mihailik <mihailik@gmail.com>"]
description = "A tiny placeholder washm crate (hello world)."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Proc-macros must be a real crate
uucore_procs = { path = "coreutils-fork/src/uucore_procs" }

# Dependencies for Brush and Coreutils
clap = { version = "4.5", features = ["derive", "env", "wrap_help", "cargo", "color"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1.48", features = ["io-util", "macros", "rt", "sync"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-recursion = "1.1"
async-trait = "0.1"
bon = "3.8"
cached = "0.56"
cfg-if = "1.0"
chrono = { version = "0.4", features = ["serde"] }
color-print = "0.3"
const_format = "0.2"
fancy-regex = "0.16"
futures = "0.3"
git-version = "0.3"
human-panic = "2.0"
indexmap = "2.12"
itertools = "0.14"
normalize-path = "0.2"
rand = "0.9"
rpds = { version = "1.2", features = ["serde"] }
strum = "0.27"
strum_macros = "0.27"
data-encoding = "2.6"
z85 = "3.0"
libc = "0.2"
os_display = "0.1"
fluent = "0.17"
fluent-syntax = "0.12"
fluent-bundle = "0.16"
unic-langid = "0.9"
# Wasm specific
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1.18", features = ["js"] }
once_cell = "1.21"
walkdir = "2.5"
peg = "0.8"
indenter = "0.3"
utf8-chars = "3.0"
crossterm = "0.29.0"


[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["fs", "process", "resource", "signal", "term", "user", "uio", "zerocopy", "dir"] }
dns-lookup = "3.0"
dunce = "1.0"
wild = "2.2"
platform-info = "2.0"


[build-dependencies]
walkdir = "2.5"
fs_extra = "1.3"
regex = "1.10"


[profile.release]
opt-level = "z"
codegen-units = 1
panic = "abort"

[patch.crates-io]
# Patch crossterm to local small shim for WASM targets to avoid building upstream with unix code
crossterm = { path = "patches/crossterm" }
