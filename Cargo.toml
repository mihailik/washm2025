[package]
name = "washm"
version = "0.1.0"
edition = "2021"
authors = ["Oleg Mihailik <mihailik@gmail.com>"]
description = "A tiny placeholder washm crate (hello world)."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Local Brush fork (submodule at ./brush-fork)
brush-shell = { path = "brush-fork/brush-shell", package = "brush-shell", default-features = false, features = ["minimal"] }

# uutils/coreutils: import the core library (uucore) directly from the Git repo.
# This uses the uutils/coreutils repository's "uucore" library crates (common internal crate).
uucore = { git = "https://github.com/uutils/coreutils.git", package = "uucore", default-features = false }

# Small, platform-neutral runtime helpers used by the guest (JSON I/O + error handling).
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

# Allow washm to register platform delegates into the crossterm shim.
crossterm = { path = "shims/crossterm" }

[profile.release]
opt-level = "z"
codegen-units = 1
panic = "abort"

[patch.crates-io]
crossterm = { path = "shims/crossterm" }
