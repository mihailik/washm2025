[package]
name = "washm"
description = "Core engine for the WASHM WebAssembly toolchain"
version.workspace = true
edition.workspace = true

[lib]
name = "washm"
path = "src/lib.rs"

[dependencies]
once_cell = "1.19"
bitflags = "2.4"
bumpalo = { version = "3.19.1", features = ["collections"] }
wat = "1.217"
wast = "217"
wasmprinter = "0.217"
ahash = "0.8"
log = "0.4"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
env_logger = "0.10"
washm-testgen-macros = { path = "testgen-macros" }
tempfile = "3.8"
similar = { version = "2.2", features = ["inline"] }
proptest = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.4", default-features = false }
