[package]
name = "washm"
description = "Core engine for the WASHM WebAssembly toolchain"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["wasm", "webassembly", "compiler", "optimization", "binaryen"]
categories = ["wasm", "compilers", "development-tools"]

[lib]
name = "washm"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
once_cell = "1.19"
bitflags = "2.4"
bumpalo = { version = "3.19.1", features = ["collections"] }
wat = "1.217"
wast = "217"
wasmprinter = "0.217"
ahash = "0.8"
log = "0.4"
anyhow = "1.0"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }


[dev-dependencies]
env_logger = "0.10"
washm-testgen-macros = { path = "testgen-macros", version = "0.4.0" }
tempfile = "3.8"
similar = { version = "2.2", features = ["inline"] }
proptest = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.4", default-features = false }
