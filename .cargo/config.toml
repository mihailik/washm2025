[build]
# Set wasm32-wasip1 as the default target so `cargo build` produces WASI preview1 artifacts
# Use wasm32-wasip1 (the preview target) because it's present in the configured toolchain in
# common developer environments. If you want the canonical `wasm32-wasi`, switch toolchains
# (e.g. `rustup toolchain install nightly` + `rustup target add wasm32-wasi --toolchain nightly`).
# target = "wasm32-wasip1"
