[package]
name = "washm-shell"
description = "WASM shell using brush and made to work on any platform."
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["minimal", "brush-builtins"]
wasm-test = []
minimal = []
basic = []
reedline = []
serde = []
debug-tracing = []
diagnostics = []
arbitrary = []
completion = []
experimental = []
experimental-load = []
experimental-builtins = []
libc = []
windows-sys = []

# Enable all brush-builtins features
brush-builtins = [
    "builtin.alias",
    "builtin.bg",
    "builtin.bind",
    "builtin.break",
    "builtin.builtin",
    "builtin.caller",
    "builtin.cd",
    "builtin.colon",
    "builtin.command",
    "builtin.compgen",
    "builtin.compopt",
    "builtin.complete",
    "builtin.continue",
    "builtin.declare",
    "builtin.dirs",
    "builtin.dot",
    "builtin.echo",
    "builtin.enable",
    "builtin.eval",
    "builtin.exec",
    "builtin.exit",
    "builtin.export",
    "builtin.false",
    "builtin.fc",
    "builtin.fg",
    "builtin.getopts",
    "builtin.hash",
    "builtin.help",
    "builtin.history",
    "builtin.jobs",
    "builtin.kill",
    "builtin.let",
    "builtin.mapfile",
    "builtin.popd",
    "builtin.printf",
    "builtin.pushd",
    "builtin.pwd",
    "builtin.read",
    "builtin.return",
    "builtin.set",
    "builtin.shift",
    "builtin.shopt",
    "builtin.suspend",
    "builtin.test",
    "builtin.times",
    "builtin.trap",
    "builtin.true",
    "builtin.type",
    "builtin.ulimit",
    "builtin.umask",
    "builtin.unalias",
    "builtin.unset",
    "builtin.wait",
]

# Feature flags matching brush-builtins crate
"builtin.alias" = []
"builtin.bg" = []
"builtin.bind" = []
"builtin.break" = []
"builtin.builtin" = []
"builtin.caller" = []
"builtin.cd" = []
"builtin.colon" = []
"builtin.command" = []
"builtin.compgen" = []
"builtin.complete" = []
"builtin.compopt" = []
"builtin.continue" = []
"builtin.declare" = []
"builtin.dirs" = []
"builtin.dot" = []
"builtin.echo" = []
"builtin.enable" = []
"builtin.eval" = []
"builtin.exec" = []
"builtin.exit" = []
"builtin.export" = []
"builtin.false" = []
"builtin.fc" = []
"builtin.fg" = []
"builtin.getopts" = []
"builtin.hash" = []
"builtin.help" = []
"builtin.history" = []
"builtin.jobs" = []
"builtin.kill" = []
"builtin.let" = []
"builtin.mapfile" = []
"builtin.popd" = []
"builtin.printf" = []
"builtin.pushd" = []
"builtin.pwd" = []
"builtin.read" = []
"builtin.return" = []
"builtin.set" = []
"builtin.shift" = []
"builtin.shopt" = []
"builtin.suspend" = []
"builtin.test" = []
"builtin.times" = []
"builtin.trap" = []
"builtin.true" = []
"builtin.type" = []
"builtin.ulimit" = []
"builtin.umask" = []
"builtin.unalias" = []
"builtin.unset" = []
"builtin.wait" = []

# Features for uucore (coreutils)
# These are currently used by the vendored uucore module.
# Most of these will be enabled soon as we integrate more coreutils.
"backup-control" = []
"colors" = []
"checksum" = []
"encoding" = []
"entries" = []
"extendedbigdecimal" = []
"fast-inc" = []
"fs" = []
"fsext" = []
"fsxattr" = []
"hardware" = []
"lines" = []
"feat_systemd_logind" = []
"format" = []
"i18n-all" = []
"i18n-common" = []
"i18n-collator" = []
"i18n-decimal" = []
"mode" = []
"perms" = []
"buf-copy" = []
"parser-num" = []
"parser-size" = []
"parser-glob" = []
"parser" = []
"pipes" = []
"process" = []
"proc-info" = []
"quoting-style" = []
"ranges" = []
"ringbuffer" = []
"safe-traversal" = []
"selinux" = []
"signals" = []
"sum" = []
"update-control" = []
"utf8" = []
"utmpx" = []
"version-cmp" = []
"wide" = []
"tty" = []
"time" = []
"uptime" = []
"benchmark" = []

[dependencies]
thiserror = "2.0"
log = "0.4"
anyhow = "1.0"
cfg-if = "1.0"
once_cell = "1.21"

[target.'cfg(any(target_os = "wasi", target_os = "wasip1"))'.dependencies]
# Proc-macros must be a real crate
uucore_procs = { version = "0.4.0", path = "coreutils-fork/src/uucore_procs" }

# Dependencies for Brush and Coreutils
clap = { version = "4.5", features = ["derive", "env", "wrap_help", "cargo", "color"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1.48", features = ["io-util", "macros", "rt", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-recursion = "1.1"
async-trait = "0.1"
bon = "3.8"
cached = "0.56"
chrono = { version = "0.4", features = ["serde"] }
color-print = "0.3"
const_format = "0.2"
fancy-regex = "0.16"
futures = "0.3"
git-version = "0.3"
human-panic = "2.0"
indexmap = "2.12"
itertools = "0.14"
normalize-path = "0.2"
rand = "0.9"
rpds = { version = "1.2", features = ["serde"] }
strum = "0.27"
strum_macros = "0.27"
data-encoding = "2.6"
z85 = "3.0"
libc = "0.2"
os_display = "0.1"
fluent = "0.17"
fluent-syntax = "0.12"
fluent-bundle = "0.16"
unic-langid = "0.9"
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1.18", features = ["js"] }
walkdir = "2.5"
peg = "0.8"
indenter = "0.3"
utf8-chars = "3.0"
regex = "1.10"


[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["fs", "process", "resource", "signal", "term", "user", "uio", "zerocopy", "dir"] }
dns-lookup = "3.0"
dunce = "1.0"
wild = "2.2"
platform-info = "2.0"


[build-dependencies]
walkdir = "2.5"
fs_extra = "1.3"
regex = "1.10"
pathdiff = "0.2"
# rust-analyzer dependencies for semantic transformation engine
ra_ap_ide = "0.0.316"
ra_ap_ide_db = "0.0.316"
ra_ap_hir = "0.0.316"
ra_ap_base_db = "0.0.316"
ra_ap_vfs = "0.0.316"
ra_ap_paths = "0.0.316"
ra_ap_project_model = "0.0.316"
ra_ap_syntax = "0.0.316"
ra_ap_ide_ssr = "0.0.316"
