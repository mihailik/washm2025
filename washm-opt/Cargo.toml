[package]
name = "washm-opt"
description = "CLI optimization tool for WebAssembly"
version.workspace = true
edition.workspace = true

[dependencies]
washm = { path = "../washm-engine", version = "0.5.0" }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
wast = "244.0.0"
wasmprinter = "0.244.0"

[[bin]]
name = "washm-opt"
path = "src/wasm_opt.rs"
