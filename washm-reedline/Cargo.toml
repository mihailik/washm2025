[package]
authors = [
    "The Nushell Project Developers",
    "reedline-async maintainers",
    "Oleg Mihailik",
]
description = "Async-native fork of nushell/reedline with WebAssembly support"
edition = "2021"
license = "MIT"
name = "reedline-async"
repository = "https://github.com/mavity/reedline-async"
rust-version = "1.63.0"
version = "0.1.0"
exclude = [
    "engine_branch.rs",
    "event_source_branch.rs",
    "external_printer_branch.rs",
    "temp_columnar.txt",
    "dummy_crossterm/",
    "dummy_fdlock/",
    "examples/wasm-repl-demo/",
    "docs/",
    ".playwright-mcp/",
    "UX_TESTING.md",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
# Keep the historical crate path so existing `use reedline::…` imports continue
# to work. Only the published package name (`reedline-async`) changes.
name = "reedline"
doctest = true

[dependencies]
arboard = { version = "3.3.0", optional = true, default-features = false, features = [
    "wayland-data-control",
] }
chrono = { version = "0.4.19", default-features = false, features = [
    "clock",
    "serde",
] }
# `crossterm` powers the default native terminal backend. It is optional
# because it does not compile for `wasm32-*` targets (see
# https://github.com/crossterm-rs/crossterm/issues/654). Disable the
# `crossterm-backend` feature to build reedline without it.
crossterm = { version = "0.29.0", features = ["serde"], optional = true }
# `fd-lock` is only used by the file-backed history; it likewise does
# not target wasm32. Gated behind the same backend feature for now.
fd-lock = { version = "4.0.2", optional = true }
itertools = "0.13.0"
futures = "0.3"
keybindings = { version = "0.0.2", optional = true }
nu-ansi-term = "0.50.0"
rusqlite = { version = "0.37.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.79", optional = true }
strip-ansi-escapes = "0.2.0"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2.0.12"
unicase = "2.8.0"
unicode-segmentation = "1.9.0"
unicode-width = "0.2"

[dev-dependencies]
gethostname = "0.4.0"
pollster = "0.3"
pretty_assertions = "1.4.0"
rstest = { version = "0.23.0", default-features = false }
serde_json = "1.0"
tempfile = "3.3.0"

[features]
default = ["crossterm-backend"]
# Enables the native terminal backend powered by `crossterm` and
# `fd-lock`. Required for any platform that talks to a real TTY. Must
# be disabled for `wasm32-*` targets that drive reedline through an
# external host (e.g. xterm.js, Node.js).
crossterm-backend = ["dep:crossterm", "dep:fd-lock"]
bashisms = []
helix = ["keybindings"]
sqlite = ["rusqlite/bundled", "serde_json"]
sqlite-dynlib = ["rusqlite", "serde_json"]
system_clipboard = ["arboard"]
libc = ["crossterm-backend", "crossterm/libc"]

[[example]]
name = "cwd_aware_hinter"
required-features = ["sqlite"]

[[example]]
name = "helix"
required-features = ["helix"]

[package.metadata.docs.rs]
# Whether to pass `--all-features` to Cargo (default: false)
all-features = false
features = ["bashisms", "sqlite"]
